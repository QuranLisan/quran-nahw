<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نحوی مشق — قرآن</title>
<meta name="description" content="قرآنی متن کی نحوی ترکیب کے لیے مشقی شیٹ — ہاتھ سے لکھیں یا ٹائپ کریں">
<meta name="theme-color" content="#191D26">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="app.css">
</head>
<body>

<header class="bar" id="bar">
  <div class="bar__brand">
    <span class="bar__mark" aria-hidden="true"></span>
    <span class="bar__name">نحوی مشق</span>
  </div>

  <div class="bar__group bar__group--main">
    <label class="field field--surah">
      <span class="field__label">سورہ</span>
      <select id="surah" class="field__input"></select>
    </label>

    <label class="field field--num">
      <span class="field__label">سے</span>
      <input id="from" class="field__input" type="number" min="1" value="1" inputmode="numeric">
    </label>

    <label class="field field--num">
      <span class="field__label">تک</span>
      <input id="to" class="field__input" type="number" min="1" value="7" inputmode="numeric">
    </label>

    <button class="btn btn--ghost" id="wholeSurah" type="button">پوری سورہ</button>

    <label class="field">
      <span class="field__label">پارہ</span>
      <select id="juz" class="field__input"></select>
    </label>
  </div>

  <div class="bar__group bar__group--end">
    <div class="seg" role="group" aria-label="حالت">
      <button class="seg__btn is-on" data-mode="hand" type="button">ہاتھ سے لکھیں</button>
      <button class="seg__btn" data-mode="type" type="button">ٹائپ کریں</button>
    </div>
    <button class="btn btn--ghost" id="settingsToggle" type="button" aria-expanded="false" aria-controls="settings">ترتیبات</button>
    <button class="btn btn--solid" id="print" type="button">پرنٹ / PDF</button>
  </div>
</header>

<div class="notice" id="notice" hidden></div>

<div class="shell">

<section class="settings" id="settings" hidden>
  <button class="settings__close" id="settingsClose" type="button">‹ واپس شیٹ پر</button>

  <div class="settings__col">
    <h2 class="settings__h">شیٹ کی قسم</h2>
    <div class="seg seg--wide" role="group" aria-label="شیٹ کی قسم">
      <button class="seg__btn is-on" data-layout="takhti" type="button">تختی</button>
      <button class="seg__btn" data-layout="jadwal" type="button">جدول</button>
      <button class="seg__btn" data-layout="satrain" type="button">سطریں</button>
    </div>
    <p class="settings__note" id="layoutNote">ہر کلمے کے نیچے لکھائی کے لیے خانہ۔</p>
  </div>

  <div class="settings__col">
    <h2 class="settings__h">خانے</h2>
    <div class="chips" id="cols"></div>
  </div>

  <div class="settings__col">
    <h2 class="settings__h">دکھائیں</h2>
    <div class="chips">
      <label class="chip"><input type="checkbox" id="optTranslation"><span>آیت کا ترجمہ</span></label>
      <label class="chip"><input type="checkbox" id="optWordMeaning"><span>لفظی معنی</span></label>
      <label class="chip"><input type="checkbox" id="optRef" checked><span>حوالہ</span></label>
      <label class="chip"><input type="checkbox" id="optVerseLine" checked><span>مکمل آیت اوپر</span></label>
      <label class="chip"><input type="checkbox" id="optGuides" checked><span>لکھائی کی لکیریں</span></label>
    </div>
  </div>

  <div class="settings__col">
    <h2 class="settings__h">تقطیع</h2>
    <div class="chips">
      <label class="chip"><input type="checkbox" id="optTaqti"><span>کلمات توڑ کر دکھائیں</span></label>
      <label class="chip"><input type="checkbox" id="optShowPos"><span>نوع پہلے سے لکھی ہو</span></label>
    </div>
    <div class="seg seg--wide" role="group" aria-label="خانے" style="margin-top:8px">
      <button class="seg__btn is-on" data-segboxes="own" type="button">ہر جزو کے اپنے خانے</button>
      <button class="seg__btn" data-segboxes="shared" type="button">مشترک خانے</button>
    </div>
    <p class="settings__note" id="morphAttr"></p>
  </div>

  <div class="settings__col">
    <h2 class="settings__h">صفحہ</h2>
    <div class="seg seg--wide" role="group" aria-label="صفحہ">
      <button class="seg__btn is-on" data-paper="auto" type="button">خودکار</button>
      <button class="seg__btn" data-paper="a4" type="button">A4</button>
      <button class="seg__btn" data-paper="fit" type="button">اسکرین</button>
    </div>
    <p class="settings__note" id="paperNote"></p>

    <h2 class="settings__h" style="margin-top:18px">تھیم</h2>
    <div class="seg seg--wide" role="group" aria-label="تھیم">
      <button class="seg__btn is-on" data-theme="auto" type="button">خودکار</button>
      <button class="seg__btn" data-theme="light" type="button">روشن</button>
      <button class="seg__btn" data-theme="dark" type="button">تاریک</button>
    </div>
    <p class="settings__note">پرنٹ ہمیشہ سفید کاغذ پر ہوگا۔</p>
  </div>

  <div class="settings__col">
    <h2 class="settings__h">پیمائش</h2>
    <label class="slider">
      <span>قرآنی خط کا سائز <b id="qsizeVal">34</b></span>
      <input type="range" id="qsize" min="20" max="60" value="34">
    </label>
    <label class="slider">
      <span>لکھائی کی جگہ <b id="boxhVal">34</b></span>
      <input type="range" id="boxh" min="16" max="90" value="34">
    </label>
    <label class="slider">
      <span>ایک سطر میں کلمات <b id="perRowVal">خودکار</b></span>
      <input type="range" id="perRow" min="0" max="8" value="0">
    </label>
  </div>

  <div class="settings__col">
    <h2 class="settings__h">فائلیں</h2>
    <div class="stack">
      <button class="btn btn--ghost" id="exportJson" type="button">جوابات محفوظ کریں (JSON)</button>
      <button class="btn btn--ghost" id="importJson" type="button">جوابات درآمد کریں</button>
      <button class="btn btn--ghost" id="cacheAll" type="button">پورا قرآن آف لائن محفوظ کریں</button>
      <button class="btn btn--ghost btn--danger" id="clearRange" type="button">اس حصے کے جوابات مٹائیں</button>
      <input type="file" id="fileInput" accept="application/json" hidden>
    </div>
  </div>
</section>


<main class="stage">
  <article class="sheet" id="sheet" lang="ar" dir="rtl">
    <div class="sheet__empty">متن لوڈ ہو رہا ہے…</div>
  </article>
</main>

</div><!-- /shell -->

<footer class="statusbar" id="status" aria-live="polite"></footer>

<script src="app.js"></script>
</body>
</html>
