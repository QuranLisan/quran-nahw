<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quran Nahw worksheets</title>
<meta name="description" content="Worksheets for Quranic grammatical analysis — handwrite or type">
<meta name="theme-color" content="#191D26">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="app.css">
</head>
<body>

<header class="bar" id="bar">
  <div class="bar__brand">
    <span class="bar__mark" aria-hidden="true"></span>
    <span class="bar__name">Quran Nahw</span>
  </div>

  <div class="bar__group bar__group--main">
    <label class="field field--surah">
      <span class="field__label">Surah</span>
      <select id="surah" class="field__input"></select>
    </label>

    <label class="field field--num">
      <span class="field__label">From</span>
      <input id="from" class="field__input" type="number" min="1" value="1" inputmode="numeric">
    </label>

    <label class="field field--num">
      <span class="field__label">To</span>
      <input id="to" class="field__input" type="number" min="1" value="7" inputmode="numeric">
    </label>

    <button class="btn btn--ghost" id="wholeSurah" type="button">Whole surah</button>

    <label class="field">
      <span class="field__label">Juz</span>
      <select id="juz" class="field__input"></select>
    </label>
  </div>

  <div class="bar__group bar__group--end">
    <div class="seg" role="group" aria-label="Mode">
      <button class="seg__btn is-on" data-mode="hand" type="button">Handwrite</button>
      <button class="seg__btn" data-mode="type" type="button">Type</button>
    </div>
    <button class="btn btn--ghost" id="settingsToggle" type="button" aria-expanded="false" aria-controls="settings">Settings</button>
    <button class="btn btn--solid" id="print" type="button">Print / PDF</button>
  </div>
</header>

<div class="notice" id="notice" hidden></div>
<div class="notice notice--font" id="fontNotice" hidden></div>

<div class="shell">

<section class="settings" id="settings" hidden>
  <button class="settings__close" id="settingsClose" type="button">‹ Back to sheet</button>

  <div class="settings__col">
    <h2 class="settings__h">Sheet layout</h2>
    <div class="seg seg--wide" role="group" aria-label="Sheet layout">
      <button class="seg__btn is-on" data-layout="takhti" type="button">Cards</button>
      <button class="seg__btn" data-layout="jadwal" type="button">Table</button>
      <button class="seg__btn" data-layout="satrain" type="button">Lines</button>
    </div>
    <p class="settings__note" id="layoutNote">One card per word, with writing space beneath.</p>
  </div>

  <div class="settings__col">
    <h2 class="settings__h">Fields</h2>
    <div class="chips" id="cols"></div>
    <p class="settings__note">Fields appear in this order, top to bottom.</p>
  </div>

  <div class="settings__col">
    <h2 class="settings__h">Show</h2>
    <div class="chips">
      <label class="chip"><input type="checkbox" id="optLabels"><span>Field labels</span></label>
      <label class="chip"><input type="checkbox" id="optColorPos"><span>Colour by word type</span></label>
      <label class="chip"><input type="checkbox" id="optTranslation"><span>Ayah translation</span></label>
      <label class="chip"><input type="checkbox" id="optWordMeaning"><span>Word meanings</span></label>
      <label class="chip"><input type="checkbox" id="optRef" checked><span>Reference</span></label>
      <label class="chip"><input type="checkbox" id="optVerseLine" checked><span>Full ayah above</span></label>
      <label class="chip"><input type="checkbox" id="optGuides" checked><span>Writing guide lines</span></label>
    </div>
    <p class="settings__note legend">
      <span class="key pos-N"></span>ism
      <span class="key pos-V"></span>fi'l
      <span class="key pos-P"></span>harf
      — needs the morphology import
    </p>
  </div>

  <div class="settings__col">
    <h2 class="settings__h">Word splitting</h2>
    <div class="chips">
      <label class="chip"><input type="checkbox" id="optTaqti"><span>Split words into parts</span></label>
      <label class="chip"><input type="checkbox" id="optShowPos"><span>Pre-fill type</span></label>
    </div>
    <div class="seg seg--wide" role="group" aria-label="Boxes per part" style="margin-top:8px">
      <button class="seg__btn is-on" data-segboxes="own" type="button">Boxes per part</button>
      <button class="seg__btn" data-segboxes="shared" type="button">Shared boxes</button>
    </div>
    <p class="settings__note" id="morphAttr"></p>
  </div>

  <div class="settings__col">
    <h2 class="settings__h">Paper</h2>
    <div class="seg seg--wide" role="group" aria-label="Paper">
      <button class="seg__btn is-on" data-paper="auto" type="button">Auto</button>
      <button class="seg__btn" data-paper="a4" type="button">A4</button>
      <button class="seg__btn" data-paper="fit" type="button">Screen</button>
    </div>
    <p class="settings__note" id="paperNote"></p>

    <h2 class="settings__h" style="margin-top:18px">Theme</h2>
    <div class="seg seg--wide" role="group" aria-label="Theme">
      <button class="seg__btn is-on" data-theme="auto" type="button">Auto</button>
      <button class="seg__btn" data-theme="light" type="button">Light</button>
      <button class="seg__btn" data-theme="dark" type="button">Dark</button>
    </div>
    <p class="settings__note">Printing is always black on white.</p>
  </div>

  <div class="settings__col">
    <h2 class="settings__h">Sizing</h2>
    <label class="slider">
      <span>Quran text size <b id="qsizeVal">34</b></span>
      <input type="range" id="qsize" min="20" max="60" value="34">
    </label>
    <label class="slider">
      <span>Writing space <b id="boxhVal">34</b></span>
      <input type="range" id="boxh" min="16" max="90" value="34">
    </label>
    <label class="slider">
      <span>Words per row <b id="perRowVal">Auto</b></span>
      <input type="range" id="perRow" min="0" max="8" value="0">
    </label>
  </div>

  <div class="settings__col">
    <h2 class="settings__h">Files</h2>
    <div class="stack">
      <button class="btn btn--ghost" id="exportJson" type="button">Export answers (JSON)</button>
      <button class="btn btn--ghost" id="importJson" type="button">Import answers</button>
      <button class="btn btn--ghost" id="cacheAll" type="button">Save all surahs offline</button>
      <button class="btn btn--ghost btn--danger" id="clearRange" type="button">Clear answers in range</button>
      <input type="file" id="fileInput" accept="application/json" hidden>
    </div>
  </div>
</section>

<main class="stage">
  <article class="sheet" id="sheet" lang="ar" dir="rtl">
    <div class="sheet__empty">Loading…</div>
  </article>
</main>

</div><!-- /shell -->

<footer class="statusbar" id="status" aria-live="polite"></footer>

<script src="app.js"></script>
</body>
</html>
